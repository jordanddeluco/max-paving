<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0b">
  <title>Max Paving Manage</title>
  <link rel="icon" type="image/png" href="img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash__inner">
    <img class="splash__logo" src="img/logo-mark.png" alt="" width="812" height="435">
    <span class="splash__bar"><i></i></span>
  </div>
</div>
<div class="app">
  <header class="topbar">
    <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="side"><span></span><span></span><span></span></button>
    <a class="brand" href="#home" aria-label="Max Paving Manage, home"><img src="img/logo-horizontal.jpg" alt="Max Paving" width="1050" height="248"><span class="brand__tag">Manage</span></a>
    <span class="topbar__title" id="top-title"></span>
    <div class="quick">
      <button type="button" class="btn btn--yellow btn--sm quick__btn" data-act="quick-add" aria-expanded="false" aria-label="New"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
      <div class="quick__pop" hidden></div>
    </div>
    <div class="topbar__user" id="top-user"></div>
  </header>
  <aside class="side" id="side">
    <a class="side__brand" href="#home"><img src="img/logo-white.png" alt="Max Paving" width="1587" height="832"><span>Manage</span></a>
    <nav class="side__nav" id="nav" aria-label="Sections"></nav>
    <div class="side__foot"><a href="https://maxpavingkc.com" target="_blank" rel="noopener">maxpavingkc.com ↗</a></div>
  </aside>
  <div class="main">
    <div id="banner"></div>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="auth-wrap" id="auth" hidden></div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" hidden>
  <div class="drawer__backdrop" data-act="close"></div>
  <div class="drawer__panel" id="drawer-panel" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="print" id="print"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
